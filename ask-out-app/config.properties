# ---------------------------------------------------------------
# Settings for the "ask them out" app.
# Edit the values on the right of each "=" sign, then restart the app.
# Lines starting with # are comments and are ignored.
# ---------------------------------------------------------------

# The name of the person you are asking out (shown in the page heading)
partner_name = Sam

# Your name (used in the confirmation email)
your_name = Alex

# Your email address. The confirmation is sent here. Leave empty to skip.
your_email =

# The question and intro text shown on the page
page_title = A Special Question!
intro_text = I have a very important question to ask you...
question = Will you go out on a date with me?

# Date ideas they can choose from. Separate options with a | character.
date_spots = Bowling & games 🎳 | Arcade games & burgers 🕹️ | Movie night with cosy couches 🍿 | Cosy drinks & good vibes 🍻 | Nice dinner in town 🍷

# Times they can choose from. Separate options with a | character.
time_slots = This Friday evening at 7:00 PM | This Saturday afternoon at 3:00 PM | This Saturday evening at 7:30 PM | This Sunday afternoon at 2:00 PM

# Email server settings (these defaults work for Gmail)
smtp_host = smtp.gmail.com
smtp_port = 465
